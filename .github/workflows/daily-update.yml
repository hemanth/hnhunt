name: Daily Show HN Sync

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      full_backfill:
        description: 'Re-run full 2012-present Hall of Fame backfill'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

concurrency:
  group: daily-show-hn-sync
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FULL_BACKFILL: ${{ inputs.full_backfill == 'true' && '1' || '0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pipeline dependencies
        run: pip install -r requirements.txt

      - name: Restore rolling cache from cache-latest release
        run: |
          mkdir -p pipeline/cache
          if gh release view cache-latest >/dev/null 2>&1; then
            gh release download cache-latest --dir pipeline/cache --clobber
            ls -lh pipeline/cache
          else
            echo "No cache-latest release yet; bootstrapping initial cache."
          fi

      - name: Sync daily Show HN launches & threads
        run: |
          python -u pipeline/01_sync_show_hn.py
          python -u pipeline/02_build_bundles.py
          python -u pipeline/03_validate.py
          node --check public/app.js
          node --check src/worker.js

      - name: Update rolling cache-latest release
        run: |
          if ! gh release view cache-latest >/dev/null 2>&1; then
            gh release create cache-latest \
              --title "Rolling Show HN Pipeline Cache" \
              --notes "Automated cache for daily incremental HNHunt syncs." \
              --prerelease
          fi
          gh release upload cache-latest \
            pipeline/cache/show_hn_stories.json \
            pipeline/cache/show_hn_threads.json \
            --clobber

      - name: Commit & push updated public/data shards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --cached --quiet; then
            echo "No Show HN bundle changes today."
          else
            TODAY=$(date -u +"%Y-%m-%d")
            git commit -m "chore(data): daily Show HN sync (${TODAY})"
            git push origin HEAD:main
          fi

      - name: Publish dataset to Hugging Face (gnumanth/hnhunt)
        if: env.HF_TOKEN != ''
        run: python -u pipeline/04_publish_hf.py

      - name: Deploy Worker & Static Assets to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler deploy
